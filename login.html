<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Motor de Cotacao de Frete - RARE WAY</title>
<style>
  :root {
    --lilac-pale: #8E3FC9;
    --dot-cor: #F5C63D;
    --acento: #B266E0;
    --acento-escuro: #9A4DD1;
    --painel-escuro: #000000;
    --painel-escuro2: #161616;
    --tinta-escura: #F5F0FA;
    --tinta-fraca: #8F8996;
    --tinta-clara: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--painel-escuro);
    color: var(--tinta-escura);
  }
  .wrap { display: flex; min-height: 100vh; width: 100%; }
  .painel-esquerdo {
    position: relative;
    flex: 0 0 44%;
    max-width: 640px;
    background: var(--lilac-pale);
    overflow: hidden;
  }
  .painel-esquerdo svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .identidade {
    position: absolute; left: 0; right: 0; top: 0;
    padding: 6vh 6vw 0;
    display: flex; flex-direction: column; gap: 16px;
  }
  .titulo {
    font-size: clamp(28px, 4vw, 50px);
    font-weight: 700; line-height: 1.04; letter-spacing: -0.01em;
    text-transform: uppercase; color: var(--tinta-clara); margin: 0;
  }
  .subtitulo {
    font-size: 13.5px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--tinta-clara); opacity: 0.82; margin: 0;
  }
  .painel-direito {
    position: relative; flex: 1;
    display: flex; align-items: center; justify-content: center;
    background: var(--painel-escuro); padding: 24px;
  }
  .marca { position: absolute; top: 38px; right: 40px; width: 150px; height: auto; }
  .form-col { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 32px; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--acento); margin: 0; }
  h1 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: 32px; font-weight: 500; color: var(--tinta-escura); margin: 10px 0 0;
  }
  .subtexto { font-size: 14px; line-height: 1.55; color: var(--tinta-fraca); max-width: 340px; margin: 10px 0 0; }
  label { font-size: 13px; font-weight: 500; color: var(--tinta-escura); display: block; margin-bottom: 8px; }
  .campo-senha { position: relative; display: flex; align-items: center; }
  input[type="password"], input[type="text"].campo-senha-texto {
    width: 100%; height: 48px; padding: 0 44px 0 16px; border-radius: 10px;
    border: 1px solid var(--painel-escuro2); background: var(--painel-escuro2);
    color: var(--tinta-escura); font-size: 15px; font-family: inherit; outline: none;
  }
  input:focus { border-color: var(--acento); }
  input::placeholder { color: var(--tinta-fraca); opacity: 1; }
  .alternar-senha { position: absolute; right: 14px; background: none; border: none; padding: 4px; cursor: pointer; line-height: 0; }
  .alternar-senha svg { display: block; }
  button.entrar {
    width: 100%; height: 50px; border-radius: 10px; border: none;
    background: var(--acento); color: var(--painel-escuro); font-family: inherit;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button.entrar:disabled { opacity: 0.6; cursor: default; }
  .erro { font-size: 13px; color: #FF8A8A; margin: 8px 0 0; min-height: 16px; }
  .divisor { height: 1px; background: var(--painel-escuro2); }
  .rodape { font-size: 12.5px; color: var(--tinta-fraca); text-align: center; margin: 0; }

  @media (max-width: 860px) {
    .painel-esquerdo { display: none; }
    .marca { top: 24px; right: 24px; width: 120px; }
  }
</style>
</head>

      <form class="form-col" id="formLogin" autocomplete="off">
        <div>
          <p class="eyebrow">Acesso restrito</p>
          <h1>Entrar</h1>
          <p class="subtexto">Use a senha de acesso da equipe de expedicao para abrir o motor de cotacao.</p>
        </div>
        <div>
          <label for="campoSenha">Senha de acesso</label>
          <div class="campo-senha">
            <input type="password" id="campoSenha" name="senha" placeholder="Digite a senha da equipe" required autofocus>
            <button type="button" class="alternar-senha" id="alternarSenha" aria-label="Mostrar senha">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke="#8F8996" stroke-width="1.6" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke="#8F8996" stroke-width="1.6"/>
              </svg>
            </button>
          </div>
          <p class="erro" id="mensagemErro"></p>
        </div>
        <button type="submit" class="entrar" id="botaoEntrar">Entrar</button>
        <div class="divisor"></div>
        <p class="rodape">Motor de Cotacao de Frete &middot; Expedicao RARE WAY</p>
      </form>
    </div>
  </div>

<script>
(function () {
  "use strict";

  function gerarPontos() {
    var painel = document.getElementById("painelEsquerdo");
    var svg = document.getElementById("svgPontos");
    if (!painel || !svg) return;
    var w = painel.clientWidth || 640;
    var h = painel.clientHeight || 900;
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    svg.innerHTML = "";

    var spacing = 14;
    var cx0 = w * 0.906;
    var cy0 = h * 0.072;
    var maxDist = Math.hypot(w, h);
    var ns = "http://www.w3.org/2000/svg";
    var frag = document.createDocumentFragment();
    var row = 0;
    for (var y = 14; y < h - 4; y += spacing) {
      var xOffset = (row % 2 === 1) ? spacing / 2 : 0;
      for (var x = 10 + xOffset; x < w - 3; x += spacing) {
        var dx = x - cx0, dy = y - cy0;
        var dist = Math.hypot(dx, dy);
        var angle = Math.atan2(dy, dx);
        var warped = dist + 40 * Math.sin(angle * 2.6 + dist * 0.010);
        var val = Math.sin(warped / 40 - 0.4);
        var t = (val + 1) / 2;
        t = Math.pow(t, 1.5);
        var r = Math.min(0.3 + t * 5.0, 5.2);
        var falloff = Math.pow(Math.max(0, 1 - dist / (maxDist * 0.78)), 1.1);
        var op = Math.max(0, Math.min(1, falloff * (0.22 + 0.82 * t)));
        if (op > 0.045) {
          var c = document.createElementNS(ns, "circle");
          c.setAttribute("cx", x.toFixed(1));
          c.setAttribute("cy", y.toFixed(1));
          c.setAttribute("r", r.toFixed(2));
          c.setAttribute("opacity", op.toFixed(3));
          c.setAttribute("fill", "#F5C63D");
          frag.appendChild(c);
        }
      }
      row++;
    }
    svg.appendChild(frag);
  }

  gerarPontos();
  var timerRedimensiona;
  window.addEventListener("resize", function () {
    clearTimeout(timerRedimensiona);
    timerRedimensiona = setTimeout(gerarPontos, 150);
  });

  var campoSenha = document.getElementById("campoSenha");
  var alternarSenha = document.getElementById("alternarSenha");
  alternarSenha.addEventListener("click", function () {
    var mostrando = campoSenha.type === "text";
    campoSenha.type = mostrando ? "password" : "text";
    alternarSenha.setAttribute("aria-label", mostrando ? "Mostrar senha" : "Ocultar senha");
  });

  var form = document.getElementById("formLogin");
  var botao = document.getElementById("botaoEntrar");
  var mensagemErro = document.getElementById("mensagemErro");

  function destinoSeguro() {
    var params = new URLSearchParams(window.location.search);
    var next = params.get("next");
    if (next && next.charAt(0) === "/" && next.charAt(1) !== "/") return next;
    return "/";
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    mensagemErro.textContent = "";
    var senha = campoSenha.value;
    if (!senha) return;
    botao.disabled = true;
    botao.textContent = "Entrando...";
    fetch("/api/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Requested-With": "motor-rareway"
      },
      body: JSON.stringify({ senha: senha })
    }).then(function (resp) {
      return resp.json().then(function (dados) {
        return { ok: resp.ok, dados: dados };
      });
    }).then(function (resultado) {
      if (resultado.ok && resultado.dados && resultado.dados.ok) {
        window.location.href = destinoSeguro();
        return;
      }
      mensagemErro.textContent = (resultado.dados && resultado.dados.mensagem) || "Nao foi possivel entrar. Tente de novo.";
      botao.disabled = false;
      botao.textContent = "Entrar";
      campoSenha.focus();
      campoSenha.select();
    }).catch(function () {
      mensagemErro.textContent = "Falha de conexao. Tente de novo.";
      botao.disabled = false;
      botao.textContent = "Entrar";
    });
  });
})();
</script>
</body>
</html>
